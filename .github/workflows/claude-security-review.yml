name: Security Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Focus on code changes that could introduce vulnerabilities
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/Dockerfile"
      - "**/.env.example"

  # Allow manual security scans
  workflow_dispatch:

# Cancel previous runs for the same PR
concurrency:
  group: security-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  security:
    # Skip for draft PRs, [skip-security] in title, or bot-triggered
    if: |
      github.event.pull_request.draft != true &&
      !contains(github.event.pull_request.title, '[skip-security]') &&
      github.actor != 'cursor[bot]' &&
      github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      # The review action hard-fails when the key is absent, which turns an
      # unconfigured fork into a permanently red required check. Probe first so
      # the job reports honestly instead. Where the secret IS configured this is
      # a no-op and the review runs exactly as before.
      - name: Check for ANTHROPIC_API_KEY
        id: keycheck
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Security review skipped::ANTHROPIC_API_KEY is not configured for this repository, so the Claude security review did not run. Add the secret to enable it."
          fi

      - name: Run Claude Security Review
        if: steps.keycheck.outputs.configured == 'true'
        # Note: Using @main as no stable version tag exists yet
        uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          upload-results: true
          claudecode-timeout: 30

          # Exclude non-critical directories
          exclude-directories: "node_modules,dist,coverage,.turbo,.next,docs"

          # Use Opus 4.5 for deeper security analysis
          claude-model: claude-opus-4-7
